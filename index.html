<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Lemurs — Strategic Branding, Websites & Digital Experiences</title>
    <meta
      name="description"
      content="Two Lemurs is a premier design and development studio turning ambitious ideas into practical solutions across branding, high-converting websites, and digital products."
    />
    <meta name="theme-color" content="#1E60F2" />

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Two Lemurs — Strategic Branding, Websites & Digital Experiences" />
    <meta
      property="og:description"
      content="Two Lemurs turns ambitious ideas into practical solutions across branding, high-converting websites, and digital products."
    />
    <meta property="og:image" content="./images/hero-image.webp" />

    <!-- Performance: Preload Critical Above-The-Fold Assets (LCP Image & Primary Fonts) -->
    <link
      rel="preload"
      as="image"
      href="./images/hero-image.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./fonts/century-gothic/CenturyGothic-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/avenir/AvenirNext-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
